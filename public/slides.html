<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VayuSuchak (वायु सूचक) - Team Roorkies (ID: 168405) - SIH 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #0b1120;
      color: #f8fafc;
      overflow: hidden;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Inter', sans-serif;
    }

    .slide-viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .slide-stage {
      width: 96vw;
      max-width: 1600px;
      aspect-ratio: 16 / 9;
      background: #ffffff;
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(56, 189, 248, 0.15);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .slide-img.active {
      display: block;
      animation: slideIn 0.2s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: scale(0.99); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Thumbnail Ribbon */
    .thumb-strip {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
      padding: 0.25rem 0.5rem;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(51, 65, 85, 0.8);
      border-radius: 9999px;
      z-index: 50;
    }

    .thumb-btn {
      width: 52px;
      height: 30px;
      border-radius: 4px;
      overflow: hidden;
      border: 2px solid transparent;
      opacity: 0.6;
      transition: all 0.2s;
      cursor: pointer;
    }

    .thumb-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .thumb-btn.active {
      opacity: 1;
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    .thumb-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Navigation Floating Controls */
    .control-pill {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(51, 65, 85, 0.9);
      padding: 0.4rem 0.9rem;
      border-radius: 9999px;
      z-index: 60;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    @media print {
      body {
        overflow: visible;
        background: white;
      }
      .control-pill, .thumb-strip { display: none !important; }
      .slide-viewport { display: block; height: auto; }
      .slide-stage {
        display: none !important;
      }
      .print-slide {
        display: block !important;
        page-break-after: always;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
      }
      .print-slide img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
    }
  </style>
</head>
<body>

<div class="slide-viewport">

  <!-- Floating Header Controls -->
  <div class="control-pill">
    <span class="text-xs font-semibold text-slate-300">
      <i class="fa-solid fa-layer-group text-sky-400 mr-1.5"></i>
      Slide <span id="current-slide" class="text-white font-bold">1</span> / <span id="total-slides">6</span>
    </span>

    <div class="h-4 w-px bg-slate-700"></div>

    <button onclick="prevSlide()" class="hover:text-sky-400 text-slate-300 transition p-1" title="Previous Slide (Left Arrow)">
      <i class="fa-solid fa-chevron-left text-sm"></i>
    </button>
    <button onclick="nextSlide()" class="hover:text-sky-400 text-slate-300 transition p-1" title="Next Slide (Right Arrow / Space)">
      <i class="fa-solid fa-chevron-right text-sm"></i>
    </button>

    <div class="h-4 w-px bg-slate-700"></div>

    <a href="/" target="_blank" class="inline-flex items-center gap-1.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold text-xs py-1.5 px-3 rounded-full transition shadow-sm" title="Launch Live Interactive Prototype Dashboard">
      <i class="fa-solid fa-arrow-up-right-from-square"></i>
      <span>Live Prototype</span>
    </a>

    <div class="h-4 w-px bg-slate-700"></div>

    <a href="/AirIntel_India_SIH26056_Presentation.pptx" download="AirIntel_India_SIH26056_Presentation.pptx" class="inline-flex items-center gap-1.5 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-bold text-xs py-1.5 px-3 rounded-full transition shadow-md shadow-amber-500/20" title="Download Official Presentation (.pptx)">
      <i class="fa-solid fa-download"></i>
      <span>Download PPT</span>
    </a>

    <button onclick="toggleFullscreen()" class="hover:text-sky-400 text-slate-300 transition p-1" title="Toggle Fullscreen (F)">
      <i class="fa-solid fa-expand text-sm"></i>
    </button>
  </div>

  <!-- Interactive Slide Stage -->
  <div class="slide-stage" id="stage">
    <img src="/Slide_1_hd.png" alt="Slide 1: Smart India Hackathon 2026 Title" class="slide-img active" id="slide-img-1" />
    <img src="/Slide_2_hd.png" alt="Slide 2: Problem & Proposed Solution Pyramid" class="slide-img" id="slide-img-2" />
    <img src="/Slide_3_hd.png" alt="Slide 3: Technical Approach & Architecture" class="slide-img" id="slide-img-3" />
    <img src="/Slide_4_hd.png" alt="Slide 4: Feasibility and Viability" class="slide-img" id="slide-img-4" />
    <img src="/Slide_5_hd.png" alt="Slide 5: Impact and Benefits" class="slide-img" id="slide-img-5" />
    <img src="/Slide_6_hd.png" alt="Slide 6: Research and References" class="slide-img" id="slide-img-6" />
  </div>

  <!-- Bottom Thumbnail Strip -->
  <div class="thumb-strip">
    <div class="thumb-btn active" onclick="goToSlide(1)"><img src="/Slide_1_hd.png" alt="Thumb 1" /></div>
    <div class="thumb-btn" onclick="goToSlide(2)"><img src="/Slide_2_hd.png" alt="Thumb 2" /></div>
    <div class="thumb-btn" onclick="goToSlide(3)"><img src="/Slide_3_hd.png" alt="Thumb 3" /></div>
    <div class="thumb-btn" onclick="goToSlide(4)"><img src="/Slide_4_hd.png" alt="Thumb 4" /></div>
    <div class="thumb-btn" onclick="goToSlide(5)"><img src="/Slide_5_hd.png" alt="Thumb 5" /></div>
    <div class="thumb-btn" onclick="goToSlide(6)"><img src="/Slide_6_hd.png" alt="Thumb 6" /></div>
  </div>

</div>

<!-- Hidden Print Slides for PDF Export -->
<div class="hidden print:block">
  <div class="print-slide"><img src="/Slide_1_hd.png" alt="Slide 1" /></div>
  <div class="print-slide"><img src="/Slide_2_hd.png" alt="Slide 2" /></div>
  <div class="print-slide"><img src="/Slide_3_hd.png" alt="Slide 3" /></div>
  <div class="print-slide"><img src="/Slide_4_hd.png" alt="Slide 4" /></div>
  <div class="print-slide"><img src="/Slide_5_hd.png" alt="Slide 5" /></div>
  <div class="print-slide"><img src="/Slide_6_hd.png" alt="Slide 6" /></div>
</div>

<script>
  let currentSlide = 1;
  const totalSlides = 6;

  function updateSlides() {
    for (let i = 1; i <= totalSlides; i++) {
      const img = document.getElementById(`slide-img-${i}`);
      if (img) {
        if (i === currentSlide) {
          img.classList.add('active');
        } else {
          img.classList.remove('active');
        }
      }
    }

    // Update Thumbnails
    const thumbs = document.querySelectorAll('.thumb-btn');
    thumbs.forEach((thumb, idx) => {
      if (idx + 1 === currentSlide) {
        thumb.classList.add('active');
      } else {
        thumb.classList.remove('active');
      }
    });

    // Update counter
    document.getElementById('current-slide').textContent = currentSlide;
  }

  function nextSlide() {
    if (currentSlide < totalSlides) {
      currentSlide++;
      updateSlides();
    }
  }

  function prevSlide() {
    if (currentSlide > 1) {
      currentSlide--;
      updateSlides();
    }
  }

  function goToSlide(n) {
    if (n >= 1 && n <= totalSlides) {
      currentSlide = n;
      updateSlides();
    }
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => console.log(err));
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  }

  // Keyboard navigation
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
      nextSlide();
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      prevSlide();
    } else if (e.key.toLowerCase() === 'f') {
      toggleFullscreen();
    } else if (e.key >= '1' && e.key <= '6') {
      goToSlide(parseInt(e.key));
    }
  });

  // Swipe support for mobile
  let touchStartX = 0;
  let touchEndX = 0;
  const stage = document.getElementById('stage');

  stage.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
  }, false);

  stage.addEventListener('touchend', (e) => {
    touchEndX = e.changedTouches[0].screenX;
    if (touchEndX < touchStartX - 50) {
      nextSlide();
    }
    if (touchEndX > touchStartX + 50) {
      prevSlide();
    }
  }, false);
</script>

</body>
</html>
