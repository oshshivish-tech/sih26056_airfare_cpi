name: MoSPI Airfare Daily Automated Scraping & CPI Index Pipeline

on:
  schedule:
    # Runs every day at 02:00 AM IST (20:30 UTC) off-peak hours
    - cron: '30 20 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape-and-update-cpi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 playwright
          playwright install chromium

      - name: Run Automated Airfare Scraping Engine & CPI Computation
        run: |
          python backend/scraper_engine_real.py --route DEL-BOM

      - name: Commit & Push Updated Daily CPI Index Dataset
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add src/data/mockData.ts backend/
          git diff-index --quiet HEAD || (git commit -m "Automated Daily Airfare CPI Ingestion - $(TZ='Asia/Kolkata' date +%Y-%m-%d)" && git push)
